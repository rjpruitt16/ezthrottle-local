app = "ezthrottle-local"
primary_region = "iad"

[build]

[env]
  PHX_HOST = "ezthrottle-local.fly.dev"
  PORT = "4000"
  PHX_SERVER = "true"
  SPILLWAY_STORE_DIR = "/data/spillway"
  SPILLWAY_MEMORY_LIMIT_MB = "400"
  SPILLWAY_MAX_BODY_BYTES = "1048576"
  SPILLWAY_DB_MAX_BYTES = "104857600"
  SPILLWAY_RETRY_AFTER_SECONDS = "5"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 1000
    soft_limit = 800

[[mounts]]
  source = "ezthrottle_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

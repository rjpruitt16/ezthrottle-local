# This is the actual "extension to a proxy" wiring: the Gateway (Envoy)
# owns routing, TLS termination, and the cluster's single ingress point;
# Spillway owns the queue behind it. Not a sidecar -- it's a normal
# ClusterIP-backed Deployment that the Gateway happens to route to.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spillway
  namespace: spillway
spec:
  parentRefs:
    - name: spillway-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: spillway
          port: 4000

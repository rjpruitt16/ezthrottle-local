# This is the actual "extension to a proxy" wiring: the Gateway (Envoy)
# owns routing, TLS termination, and the cluster's single ingress point;
# EZThrottle Local owns the queue behind it. Not a sidecar -- it's a normal
# ClusterIP-backed Deployment that the Gateway happens to route to.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ezthrottle-local
  namespace: ezthrottle-local
spec:
  parentRefs:
    - name: ezthrottle-local-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ezthrottle-local
          port: 4000

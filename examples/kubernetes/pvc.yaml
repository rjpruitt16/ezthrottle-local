# ReadWriteOnce is intentional, not a placeholder to loosen later.
# EZThrottle Local's durable queue is Mnesia disc_copies backed by a local
# directory (MNESIA_DIR) per instance, and scaling is by partitioning
# instances (one per upstream/tenant), not by replicas sharing state -- see
# the root README's partitioning notes (e.g. the pool-registration section).
# A ReadWriteMany volume would let multiple pods mount the same Mnesia
# directory, which this app never expects and does not coordinate around.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ezthrottle-local-data
  namespace: ezthrottle-local
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # storageClassName: ""  # set to a ReadWriteOnce-capable StorageClass for your cluster

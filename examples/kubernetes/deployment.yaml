# replicas: 1 is load-bearing, not a default left unconfigured. The
# store here is a local, per-instance directory (SPILLWAY_STORE_DIR), and
# pool membership plus the SSE/PubSub subscriber state are in-process only
# (BEAM, not shared across nodes in this deployment shape). Scaling is by
# **partitioning** -- running one instance per upstream domain or tenant --
# not by adding replicas behind one Service. See the root README's
# partitioning notes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spillway
  namespace: spillway
  labels:
    app: spillway
spec:
  replicas: 1
  strategy:
    type: Recreate # avoid two pods ever attaching the same RWO volume during a rollout
  selector:
    matchLabels:
      app: spillway
  template:
    metadata:
      labels:
        app: spillway
    spec:
      containers:
        - name: spillway
          image: your-registry/spillway:latest # build from this repo's Dockerfile -- not currently published
          ports:
            - containerPort: 4000
          env:
            - name: PHX_SERVER
              value: "true"
            - name: PORT
              value: "4000"
            - name: PHX_HOST
              value: spillway.example.com # the Gateway's own hostname/domain in your cluster
            - name: SPILLWAY_STORE_DIR
              value: /data/spillway
            # A stable node name. rel/env.sh.eex otherwise names the Erlang
            # node after $(hostname), the Pod's own name, which changes on
            # every restart. When the store was Mnesia this was required:
            # its on-disk schema belonged to one node name, and a pod with
            # a new name crash-looped on boot (node_not_running). The
            # RocksDB store isn't tied to the node name; this stays so the
            # node keeps one name across restarts. Fly.io does the same via
            # FLY_APP_NAME in rel/env.sh.eex.
            - name: RELEASE_NODE
              value: spillway@localhost
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: spillway-secret
                  key: secret-key-base
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            # Starting point only -- see the root README's "For maximum
            # queue capacity" guidance and benchmark.md for real numbers
            # before sizing this for your own traffic shape.
            #
            # No memory limit set, deliberately -- confirmed in testing
            # (kind on Docker Desktop) that a memory limit here causes an
            # immediate OOMKill (exit 137) on every boot attempt, at 512Mi
            # AND at 1Gi, despite the app using ~136MiB in the exact same
            # image run under plain `docker run -m 512m`. CPU limit alone
            # is unaffected. Looked like a BEAM/cgroup memory-detection
            # mismatch specific to this environment, not a real app
            # memory requirement -- test carefully in your own cluster
            # before adding one back, and set SPILLWAY_MEMORY_LIMIT_MB
            # (the app's own admission-control limit, not a cgroup one)
            # instead if you want a safety net.
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: spillway-data
